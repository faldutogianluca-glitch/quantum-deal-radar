*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1350px;overflow:hidden;font-family:Inter,sans-serif;background:#fff;color:#1B307C;position:relative}
.top{position:absolute;top:0;left:0;right:0;height:18px;background:#1B307C}.top::after{content:"";position:absolute;top:18px;left:0;right:0;height:4px;background:#E07430}

.in{position:absolute;left:96px;right:96px;top:150px}
.eb{font-weight:600;font-size:26px;letter-spacing:.12em;text-transform:uppercase;color:#E07430;display:flex;align-items:center;gap:18px;margin-bottom:40px}
.eb::before{content:"";width:56px;height:4px;background:currentColor}
.navy .eb{color:#EB7A32}

.acc{color:#E07430}.navy .acc{color:#EB7A32}
p{font-size:38px;line-height:1.4;color:#283772;margin-top:36px}.navy p{color:rgba(255,255,255,.85)}
.foot{position:absolute;left:96px;right:96px;bottom:70px;display:flex;justify-content:space-between;align-items:center;font-size:24px;color:#4a5578}
.navy .foot{color:rgba(255,255,255,.75)}
.foot img{height:96px}
.navy .logo-plate{background:#fff;border-radius:14px;padding:10px 14px;display:flex}
.art{position:absolute;left:96px;right:96px}
