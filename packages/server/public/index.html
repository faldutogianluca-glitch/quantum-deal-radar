<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quantum Deal Radar</title>
  <!-- Icona inline: evita la richiesta automatica a /favicon.ico, che rispondeva 404. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234f8cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234f8cff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">Quantum Deal Radar</span>
    <span class="tagline">Monitoraggio immobili distressed</span>
  </header>

  <main>
    <section class="panel">
      <form id="filtri" class="filters">
        <select id="f-fonte"><option value="">Tutte le fonti</option></select>
        <input id="f-comune" type="text" placeholder="Comune">
        <input id="f-prezzo-min" type="number" placeholder="Prezzo min">
        <input id="f-prezzo-max" type="number" placeholder="Prezzo max">
        <label class="checkbox"><input id="f-praticabili" type="checkbox"> solo praticabili</label>
        <label class="checkbox"><input id="f-ribassati" type="checkbox"> solo ribassati</label>
        <select id="f-ordine">
          <option value="recenti">Piu' recenti</option>
          <option value="ribasso">Ribasso maggiore</option>
          <option value="anzianita">In radar da piu' tempo</option>
          <option value="deserti">Piu' aste deserte</option>
        </select>
        <button type="submit">Filtra</button>
      </form>

      <div class="actions">
        <button id="btn-scrape">Avvia scraping</button>
        <button id="btn-enrich">Arricchisci (zone OMI + valutazione)</button>
        <span id="azione-stato" class="azione-stato"></span>
      </div>
    </section>

    <section id="risultati-count" class="results-count"></section>
    <section id="griglia" class="listing-grid"></section>
  </main>

  <div id="dettaglio-overlay" class="overlay hidden">
    <div class="overlay-card">
      <button id="chiudi-dettaglio" class="chiudi">&times;</button>
      <div id="dettaglio-contenuto"></div>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
