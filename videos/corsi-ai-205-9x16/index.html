<!doctype html>
<html lang="it">

    <style>

      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }

  <body>

      <div id="el-02-il-vuoto" class="scene" data-composition-id="02-il-vuoto" data-composition-src="compositions/frames/02-il-vuoto.html" data-start="3" data-duration="3.5" data-track-index="1"></div>
      <div id="el-03-la-risposta" class="scene" data-composition-id="03-la-risposta" data-composition-src="compositions/frames/03-la-risposta.html" data-start="6.5" data-duration="4" data-track-index="0"></div>
      <div id="el-04-cta" class="scene" data-composition-id="04-cta" data-composition-src="compositions/frames/04-cta.html" data-start="10.5" data-duration="4.5" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      window.__timelines["main"].to({}, { duration: 15 }, 0);
    </script>
  </body>
</html>
