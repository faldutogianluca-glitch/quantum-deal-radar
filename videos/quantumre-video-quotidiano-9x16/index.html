<!doctype html>
<html
  lang="it"
  data-composition-variables='[
    {"id":"serie","type":"string","label":"Serie","default":"La casa in pillole"},
    {"id":"num","type":"string","label":"Numero","default":"n. 4"},
    {"id":"h1","type":"string","label":"Gancio","default":"La garanzia dello Stato sul mutuo"},
    {"id":"h2","type":"string","label":"Gancio, parte in arancio","default":"c&#39;è ancora."},
    {"id":"kicker","type":"string","label":"Titolo della lista","default":"Tre cose da fare"},
    {"id":"p1","type":"string","label":"Punto 1","default":"Chiedete se la banca aderisce al Fondo"},
    {"id":"p2","type":"string","label":"Punto 2","default":"Fate l&#39;ISEE aggiornato prima di andare in filiale"},
    {"id":"p3","type":"string","label":"Punto 3","default":"Restate entro 250.000 euro di mutuo"},
    {"id":"rule","type":"string","label":"La regola","default":"La garanzia abbassa l&#39;anticipo, non il costo."},
    {"id":"cta1","type":"string","label":"Invito","default":"Salvate il video."},
    {"id":"cta2","type":"string","label":"Invito, riga piccola","default":"Ogni settimana una pillola sulla casa."},
    {"id":"src","type":"string","label":"Fonte o nota","default":""}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Playfair Display"; font-weight: 700; font-display: block; src: url("assets/fonts/PlayfairDisplay-700.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 500; font-display: block; src: url("assets/fonts/Inter-500.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; font-display: block; src: url("assets/fonts/Inter-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 700; font-display: block; src: url("assets/fonts/Inter-700.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #ffffff; font-family: "Inter", sans-serif; color: #1b307c; }
      .scene { position: absolute; inset: 0; }
      .s-white { background: #ffffff; }
      .s-navy { background: #1b307c; }
      .topbar { position: absolute; left: 0; top: 0; width: 100%; height: 26px; background: #1b307c; transform-origin: 0% 50%; }
      .topbar-acc { position: absolute; left: 0; top: 26px; width: 100%; height: 5px; background: #E07430; transform-origin: 0% 50%; }
      .s-navy .topbar { background: #EB7A32; }
      .eb { position: absolute; left: 80px; right: 80px; font-weight: 600; font-size: 34px; letter-spacing: .14em; text-transform: uppercase; color: #E07430; display: flex; align-items: center; gap: 22px; }
      .eb::before { content: ""; width: 70px; height: 5px; background: currentColor; flex: none; }
      .s-navy .eb { color: #EB7A32; }
      .pf { font-family: "Playfair Display", serif; font-weight: 700; letter-spacing: -0.02em; }
      .col { position: absolute; left: 80px; right: 80px; display: flex; flex-direction: column; }
      #hook1 { font-size: 112px; line-height: 1.04; color: #1b307c; }
      #hook2 { font-size: 112px; line-height: 1.04; color: #E07430; margin-top: 12px; }
      .row { display: grid; grid-template-columns: 96px 1fr 70px; align-items: center; border: 4px solid rgba(27,48,124,.15); border-radius: 24px; padding: 34px 32px; background: #fff; margin-bottom: 26px; }
      .row .k { font-family: "Playfair Display", serif; font-weight: 700; font-size: 84px; line-height: 1; color: #E07430; }
      .row .t { font-family: "Playfair Display", serif; font-weight: 700; font-size: 60px; line-height: 1.1; color: #1b307c; }
      .tick { width: 64px; height: 64px; border-radius: 50%; background: #1b307c; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 36px; }
      #rule { font-size: 104px; line-height: 1.08; color: #ffffff; }
      #ruleline { width: 120px; height: 8px; background: #EB7A32; margin-top: 50px; transform-origin: 0% 50%; }
      .logo { position: absolute; left: 290px; width: 500px; top: 330px; }
      .logo img { display: block; width: 100%; }
      #cta1 { position: absolute; left: 80px; right: 80px; top: 720px; text-align: center; font-size: 120px; line-height: 1.05; color: #1b307c; }
      #cta2 { position: absolute; left: 80px; right: 80px; top: 1010px; text-align: center; font-weight: 600; font-size: 50px; line-height: 1.3; color: #283772; }
      #link { position: absolute; left: 50%; top: 1170px; width: 760px; margin-left: -380px; height: 130px; border-radius: 100px; background: #1b307c; color: #fff; font-weight: 600; font-size: 46px; display: flex; align-items: center; justify-content: center; }
      #link b { color: #EB7A32; font-weight: 700; margin-left: .3em; }
      #src { position: absolute; left: 80px; right: 80px; top: 1360px; text-align: center; font-weight: 500; font-size: 26px; line-height: 1.35; color: #4a5578; }
      #ai { position: absolute; left: 80px; right: 80px; top: 1440px; text-align: center; font-weight: 500; font-size: 27px; line-height: 1.35; color: #4a5578; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <!-- Scena 1, 0-3.6 s: il gancio -->
      <div id="sc1" class="scene s-white clip" data-start="0" data-duration="3.6" data-track-index="0">
        <div class="topbar" id="tb1"></div><div class="topbar-acc" id="ta1"></div>
        <div class="eb" id="eb1" style="top:400px;opacity:0"><span id="serie">La casa in pillole</span><span id="num" style="opacity:.75">n. 4</span></div>
        <div class="col" style="top:500px">
          <div class="pf" id="hook1" style="opacity:0">La garanzia dello Stato sul mutuo</div>
          <div class="pf" id="hook2" style="opacity:0">c'è ancora.</div>
        </div>
      </div>
      <!-- Scena 2, 3.6-10.6 s: tre punti -->
      <div id="sc2" class="scene s-white clip" data-start="3.6" data-duration="7" data-track-index="0">
        <div class="topbar"></div><div class="topbar-acc"></div>
        <div class="eb" id="kicker" style="top:330px;opacity:0">Tre cose da fare</div>
        <div class="col" style="top:430px">
          <div class="row" id="r1" style="opacity:0"><span class="k">1</span><span class="t" id="p1">Punto 1</span><span class="tick" id="t1" style="opacity:0">✓</span></div>
          <div class="row" id="r2" style="opacity:0"><span class="k">2</span><span class="t" id="p2">Punto 2</span><span class="tick" id="t2" style="opacity:0">✓</span></div>
          <div class="row" id="r3" style="opacity:0"><span class="k">3</span><span class="t" id="p3">Punto 3</span><span class="tick" id="t3" style="opacity:0">✓</span></div>
        </div>
      </div>
      <!-- Scena 3, 10.6-13 s: la regola -->
      <div id="sc3" class="scene s-navy clip" data-start="10.6" data-duration="2.6" data-track-index="0">
        <div class="topbar"></div><div class="topbar-acc"></div>
        <div class="eb" id="eb3" style="top:470px;opacity:0">La regola che uso</div>
        <div class="col" style="top:570px">
          <div class="pf" id="rule" style="opacity:0">La regola</div>
          <div id="ruleline"></div>
        </div>
      </div>
      <!-- Scena 4, 13.2-16 s: invito e nota AI -->
      <div id="sc4" class="scene s-white clip" data-start="13.2" data-duration="2.8" data-track-index="0">
        <div class="topbar"></div><div class="topbar-acc"></div>
        <div class="logo" id="logo"><img src="assets/logo-quantumre.svg" alt="Quantum RE" /></div>
        <div class="pf" id="cta1" style="opacity:0">Salvate il video.</div>
        <div id="cta2" style="opacity:0">Ogni settimana una pillola sulla casa.</div>
        <div id="link" style="opacity:0">Link in bio<b>quantumre.it</b></div>
        <div id="src" style="opacity:0"></div>
        <div id="ai" style="opacity:0">Contenuto generato con AI sotto la supervisione di Gianluca Falduto.</div>
      </div>
    </div>
    <script>
      (function () {
        const v = (window.__hyperframes && window.__hyperframes.getVariables) ? window.__hyperframes.getVariables() : {};
        const set = (id, val) => { const el = document.getElementById(id); if (el && typeof val === "string") el.textContent = val; };
        ["serie", "num", "kicker", "p1", "p2", "p3", "rule", "cta1", "cta2", "src"].forEach((k) => set(k, v[k]));
        set("hook1", v.h1); set("hook2", v.h2);
        if (!v.num) document.getElementById("num").style.display = "none";

        const tl = gsap.timeline({ paused: true });
        const $ = (id) => document.getElementById(id);
        const rise = (el, t, y, d) => { tl.set(el, { opacity: 1, y: y || 50 }, t); tl.to(el, { y: 0, duration: d || 0.45, ease: "power4.out" }, t); };
        const fadeUp = (el, t, d) => tl.fromTo(el, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: d || 0.5, ease: "power3.out" }, t);

        // Scena 1: barra, sopratitolo, gancio in due tempi
        tl.fromTo($("tb1"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.out" }, 0);
        tl.fromTo($("ta1"), { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 0.1);
        rise($("eb1"), 0.1, 30, 0.4);
        rise($("hook1"), 0.3, 70, 0.5);
        tl.fromTo($("hook2"), { opacity: 0, y: 90, scale: 1.06 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" }, 1.0);

        // Scena 2: tre righe una alla volta, ognuna con la spunta
        rise($("kicker"), 3.7, 30, 0.4);
        [1, 2, 3].forEach((i) => {
          const t = 3.9 + (i - 1) * 1.6;
          rise($("r" + i), t, 70, 0.45);
          tl.fromTo($("r" + i), { borderColor: "rgba(224,116,48,.6)" }, { borderColor: "rgba(27,48,124,.15)", duration: 0.9, ease: "power2.out" }, t + 0.3);
          tl.fromTo($("t" + i), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2)" }, t + 0.8);
        });

        // Scena 3: la regola su fondo blu
        rise($("eb3"), 10.7, 30, 0.4);
        rise($("rule"), 10.85, 70, 0.55);
        tl.fromTo($("ruleline"), { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 11.4);

        // Scena 4: logo, invito, link, nota AI
        tl.fromTo($("logo"), { scale: 0.6, opacity: 0, y: 14 }, { scale: 1, opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 13.25);
        rise($("cta1"), 13.6, 60, 0.5);
        fadeUp($("cta2"), 13.95);
        tl.fromTo($("link"), { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 14.2);
        tl.to($("link"), { scale: 0.93, duration: 0.14, ease: "power1.in" }, 14.75);
        tl.to($("link"), { scale: 1, duration: 0.45, ease: "back.out(1.8)" }, 14.89);
        if (v.src) fadeUp($("src"), 14.4);
        fadeUp($("ai"), 14.5);

        tl.to({}, { duration: 16 }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
