  <style>

  </style>

  <div id="root" data-composition-id="01-hook" data-start="0" data-duration="5" data-width="1080" data-height="1350">
    <div id="h01-hook-bg" class="clip" data-start="0" data-duration="5" data-track-index="0"></div>
    <div id="h01-hook-qmark" class="clip" data-start="0" data-duration="5" data-track-index="1">?</div>
    <div id="h01-hook-topbar" class="clip" data-start="0" data-duration="5" data-track-index="2"></div>

    <div id="h01-hook-question" class="clip" data-start="0" data-duration="5" data-track-index="3">
      <span class="h01-hook-qline" id="h01-hook-q1">Hai un</span>
      <span class="h01-hook-qline" id="h01-hook-q2">immobile</span>
      <span class="h01-hook-qline" id="h01-hook-q3">che <span class="h01-hook-accent">non</span></span>

      <i class="h01-hook-tick" id="h01-hook-t1"></i>

  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="01-hook"] ' + s);

      // One beat grid drives every hit.
      const PULSE = 0.3;
      const S1 = [0.1, 0.1 + PULSE, 0.1 + PULSE * 2, 0.1 + PULSE * 3]; // question lines
      const SHRINK = 1.6;
      const SWAP = [1.95, 2.75, 3.55]; // steady swap beat (0.8s)

      // Static initial states for the scene-2 layer (hidden until its phase).
      tl.set([q("#h01-hook-eyebrow"), q("#h01-hook-eyebrow-rule"), q("#h01-hook-swap1"), q("#h01-hook-swap2"), q("#h01-hook-swap3"), q("#h01-hook-ticks")], { opacity: 0 }, 0);

      // ── Scene 1 (0.0–1.6s): question rises in line by line (kinetic-beat-slam, rise variant)
      tl.fromTo(q("#h01-hook-q1"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "circ.out" }, S1[0]);
      tl.fromTo(q("#h01-hook-q2"), { y: 70, rotation: 3, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.45, ease: "power4.out" }, S1[1]);
      tl.fromTo(q("#h01-hook-q3"), { x: -120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "expo.out" }, S1[2]);
      // the orange payoff slams: scale + blur
      tl.fromTo(q("#h01-hook-q4"), { scale: 1.35, filter: "blur(14px)", opacity: 0, transformOrigin: "0% 60%" }, { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" }, S1[3]);
      tl.fromTo(q("#h01-hook-qmark"), { y: 60, opacity: 0 }, { y: 0, opacity: 0.08, duration: 0.9, ease: "power2.out" }, S1[3]);

      // ── Scene 2 (1.6–4.2s): question shrinks up to an eyebrow; one swap line changes in place
      tl.to(q("#h01-hook-question"), { scale: 0.36, y: -110, duration: 0.38, ease: "power3.inOut" }, SHRINK);
      tl.to(q("#h01-hook-question"), { opacity: 0, duration: 0.14, ease: "none" }, SHRINK + 0.24);
      tl.fromTo(q("#h01-hook-eyebrow"), { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, SHRINK + 0.26);
      tl.fromTo(q("#h01-hook-eyebrow-rule"), { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.3, ease: "power2.out" }, SHRINK + 0.3);
      tl.fromTo(q("#h01-hook-ticks"), { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, SHRINK + 0.3);

      // Underline setup (svg-path-draw): measured length, fully hidden.
      const uline = q("#h01-hook-uline");
      const len = uline.getTotalLength() * 1.05;
      tl.set(uline, { strokeDasharray: len, strokeDashoffset: len }, 0);

      const swaps = [q("#h01-hook-swap1"), q("#h01-hook-swap2"), q("#h01-hook-swap3")];
      const ticks = [q("#h01-hook-t1"), q("#h01-hook-t2"), q("#h01-hook-t3")];
      swaps.forEach((el, i) => {
        const t = SWAP[i];
        // hard cut: same position, same size — only the words change
        if (i > 0) tl.set(swaps[i - 1], { opacity: 0 }, t);
        tl.set(el, { opacity: 1 }, t);
        // underline re-draws on each swap
        tl.set(uline, { strokeDashoffset: len }, t);
        tl.to(uline, { strokeDashoffset: 0, duration: 0.4, ease: "power2.out" }, t + 0.05);
        // rhythm chrome ticks keep the beat
        tl.fromTo(ticks[i], { opacity: 0.18 }, { opacity: 1, duration: 0.12, ease: "none" }, t);
      });

      // ── Scene 3 (4.2–5.0s): last swap holds still.
      tl.set({}, {}, 5);

      window.__timelines["01-hook"] = tl;
    })();
  </script>
