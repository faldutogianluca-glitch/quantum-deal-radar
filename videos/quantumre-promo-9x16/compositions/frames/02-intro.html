  <script>
    (function () {
      var $ = function (id) {
        return document.getElementById(id);
      };
      var tl = gsap.timeline({ paused: true });
      var F = 1 / 60;

      // ---- svg-path-draw setup: measured lengths (analytic fallback) ----
      function prep(el, fallback) {
        var len = fallback;
        try {
          if (el && typeof el.getTotalLength === "function") {
            var m = el.getTotalLength();
            if (m && isFinite(m) && m > 0) len = m;
          }
        } catch (e) {}
        len = len * 1.03;
        el.style.strokeDasharray = len + " " + len;
        el.style.strokeDashoffset = String(len);
        return len;
      }
      var ring = $("f02-intro-ring");
      var handle = $("f02-intro-handle");
      var house = $("f02-intro-house");
      var ringLen = prep(ring, 2 * Math.PI * 80);
      var handleLen = prep(handle, Math.sqrt(48 * 48 + 50 * 50));
      var houseLen = prep(house, 2 * Math.sqrt(44 * 44 + 40 * 40) + 48 * 2 + 88);

      // ---- Background: very slow push-in under everything (0 -> 5s) ----
      tl.fromTo($("f02-intro-photo"), { scale: 1.0 }, { scale: 1.08, duration: 5, ease: "none" }, 0);

      // ---- Scene 1 (0.0-1.6s): plate settles, logo assembles part by part ----
      tl.fromTo(
        $("f02-intro-plate"),
        { opacity: 0, scale: 0.94, y: 20 },
        { opacity: 1, scale: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.05
      );
      // ring draws from 12 o'clock
      tl.fromTo(ring, { strokeDashoffset: ringLen }, { strokeDashoffset: 0, duration: 0.55, ease: "power2.out" }, 0.2);
      // handle extends (starts at ~75% of ring)
      tl.fromTo(handle, { opacity: 0 }, { opacity: 1, duration: 0.01 }, 0.6);
      tl.fromTo(handle, { strokeDashoffset: handleLen }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 0.6);
      // orange house outline draws inside the ring
      tl.fromTo(house, { strokeDashoffset: houseLen }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.out" }, 0.8);
      // wordmark fades up after the last stroke settles
      tl.fromTo(
        $("f02-intro-wordmark"),
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power1.out" },
        1.2
      );

      // ---- Scene 2 (1.8-3.0s): value line rises in ----
      tl.fromTo($("f02-intro-accent"), { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.8);
      tl.fromTo(
        $("f02-intro-line-1"),
        { opacity: 0, y: 56 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        1.85
      );
      tl.fromTo(
        $("f02-intro-line-2"),
        { opacity: 0, y: 56 },
        { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
        2.0
      );

      // ---- Scene 3 (3.0-5.0s): pills waterfall in left->right, then hold ----
      var p1 = $("f02-intro-pill-1");
      var p2 = $("f02-intro-pill-2");
      var p3 = $("f02-intro-pill-3");
      tl.set([p1, p2, p3], { opacity: 0 }, 0);
      var t0 = 3.0;
      tl.set(p1, { opacity: 1, y: 84 }, t0);
      tl.to(p1, { y: 0, duration: 0.18, ease: "power4.out" }, t0);
      var t1 = t0 + 0.18 + 2 * F;
      tl.set(p2, { opacity: 1, y: 68 }, t1);
      tl.to(p2, { y: 0, duration: 0.16, ease: "power4.out" }, t1);
      var t2 = t1 + 0.16 - F;
      tl.set(p3, { opacity: 1, y: 58 }, t2);
      tl.to(p3, { y: 0, duration: 0.14, ease: "power4.out" }, t2);

      // pad timeline to full frame length (hold)
      tl.set({}, {}, 5);

      window.__timelines = window.__timelines || {};
      window.__timelines["02-intro"] = tl;
    })();
