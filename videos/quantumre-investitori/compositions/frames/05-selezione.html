<template>
  <div
    id="root"
    data-composition-id="05-selezione"
    data-start="0"
    data-duration="7.5"
    data-width="1080"
    data-height="1350"
  >
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Playfair Display";
        src: url("assets/fonts/PlayfairDisplay-500.woff2") format("woff2");
        font-weight: 500;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Playfair Display";
        src: url("assets/fonts/PlayfairDisplay-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Playfair Display";
        src: url("assets/fonts/PlayfairDisplay-700.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }

      #root {
        position: relative;
        width: 1080px;
        height: 1350px;
        overflow: hidden;
        font-family: "Inter", sans-serif;
        color: #1b307c;
      }

      .clip {
        position: absolute;
        inset: 0;
      }

      #s05-bg {
        background: #ffffff;
      }

      #s05-stage {
        transform-origin: 50% 35%;
      }

      /* grid — 10 cols x 8 rows, 81px pitch, 810px wide (75%), centred */
      #s05-grid {
        position: absolute;
        left: 135px;
        top: 100px;
        width: 810px;
        height: 648px;
      }
      .s05-tile {
        position: absolute;
        width: 81px;
        height: 81px;
        color: #1b307c;
      }
      .s05-house,
      .s05-house-on {
        position: absolute;
        left: 10px;
        top: 10px;
        width: 61px;
        height: 61px;
        overflow: visible;
      }
      .s05-house path {
        fill: none;
        stroke: currentColor;
        stroke-width: 3;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .s05-house-on {
        opacity: 0;
        transform-origin: 50% 60%;
      }
      .s05-house-on .s05-body {
        fill: #e07430;
        stroke: #e07430;
        stroke-width: 3;
        stroke-linejoin: round;
      }
      .s05-house-on .s05-door {
        fill: #ffffff;
      }

      #s05-headline {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 808px;
        text-align: center;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 72px;
        line-height: 1.1;
        letter-spacing: -0.02em;
        color: #1b307c;
      }

      .s05-close {
        position: absolute;
        left: 72px;
        right: 72px;
        top: 932px;
        text-align: center;
        font-family: "Playfair Display", serif;
        font-weight: 500;
        font-size: 52px;
        line-height: 1.28;
        letter-spacing: -0.02em;
        color: #1b307c;
      }
      .s05-close-line {
        display: block;
      }
      #s05-close-2 {
        color: #e07430;
        font-weight: 700;
      }
    </style>

    <!-- full-bleed ground -->
    <div id="s05-bg" class="clip" data-start="0" data-duration="7.5" data-track-index="0"></div>

    <!-- content stage (slow camera push runs on this) -->
    <div id="s05-stage" class="clip" data-start="0" data-duration="7.5" data-track-index="1">
      <div id="s05-grid"></div>

      <div id="s05-headline">Diciamo molti no.</div>

      <div class="s05-close">
        <span class="s05-close-line" id="s05-close-1">Per dire sì solo ai deal</span>
        <span class="s05-close-line" id="s05-close-2">che stanno in piedi.</span>
      </div>
    </div>

    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var root = document.querySelector('[data-composition-id="05-selezione"]');
        var q = function (sel) { return root.querySelector(sel); };
        var tl = gsap.timeline({ paused: true });

        var COLS = 10;
        var ROWS = 8;
        var PITCH = 81;
        var N = COLS * ROWS;
        // deterministic, scattered survivors (row*10+col)
        var KEEP = [12, 27, 33, 46, 58, 71];

        var OUTLINE =
          '<svg class="s05-house" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path d="M8 22 L24 8 L40 22 V40 H8 Z"></path>' +
          '<path d="M20 40 V30 H28 V40"></path></svg>';
        var FILLED =
          '<svg class="s05-house-on" viewBox="0 0 48 48" aria-hidden="true">' +
          '<path class="s05-body" d="M8 22 L24 8 L40 22 V40 H8 Z"></path>' +
          '<rect class="s05-door" x="20.5" y="30" width="7" height="10" rx="1"></rect></svg>';

        // build the grid synchronously
        var grid = q("#s05-grid");
        var tiles = [];
        for (var i = 0; i < N; i++) {
          var r = Math.floor(i / COLS);
          var c = i % COLS;
          var tile = document.createElement("div");
          tile.className = "s05-tile";
          tile.id = "s05-tile-" + i;
          tile.style.left = c * PITCH + "px";
          tile.style.top = r * PITCH + "px";
          tile.innerHTML = OUTLINE + (KEEP.indexOf(i) >= 0 ? FILLED : "");
          grid.appendChild(tile);
          tiles.push(tile);
        }

        // ── Camera: very slow continuous push-in under the whole shot ──
        tl.fromTo(q("#s05-stage"), { scale: 1 }, { scale: 1.025, duration: 7, ease: "none" }, 0);

        // ── Scene 1 (0.0–1.6s): grid waterfalls in row by row ──
        for (var j = 0; j < N; j++) {
          var row = Math.floor(j / COLS);
          var col = j % COLS;
          tl.fromTo(
            tiles[j],
            { opacity: 0, y: -18 },
            { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" },
            0.05 + row * 0.13 + col * 0.015
          );
        }

        // ── Scene 2 (1.6–3.8s): headline rises; most tiles fade to grey ──
        tl.fromTo(
          q("#s05-headline"),
          { opacity: 0, y: 34 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          1.65
        );

        // deterministic scattered order: (k * 37) mod 80 — 37 is coprime with 80
        var order = [];
        for (var k = 0; k < N; k++) {
          var idx = (k * 37 + 5) % N;
          if (KEEP.indexOf(idx) < 0) order.push(idx);
        }
        var FADE_AT = 1.75;
        var FADE_SPAN = 1.45;
        var step = FADE_SPAN / order.length;
        order.forEach(function (idx, n) {
          tl.fromTo(
            tiles[idx].querySelector(".s05-house"),
            { color: "#1b307c", opacity: 1 },
            { color: "#c9ccd6", opacity: 0.55, duration: 0.35, ease: "power2.out" },
            FADE_AT + n * step
          );
        });

        // survivors turn solid orange with a small spring-pop
        KEEP.forEach(function (idx, n) {
          tl.fromTo(
            tiles[idx].querySelector(".s05-house-on"),
            { opacity: 0, scale: 0.6 },
            { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(2.4)" },
            3.25 + n * 0.08
          );
          tl.fromTo(
            tiles[idx].querySelector(".s05-house"),
            { opacity: 1 },
            { opacity: 0, duration: 0.25, ease: "power2.out" },
            3.25 + n * 0.08
          );
        });

        // ── Scene 3 (3.8–7.0s): closing lines rise in, then hold ──
        tl.fromTo(
          q("#s05-close-1"),
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          3.85
        );
        tl.fromTo(
          q("#s05-close-2"),
          { opacity: 0, y: 30 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" },
          4.3
        );

        window.__timelines["05-selezione"] = tl;
      })();
    </script>
  </div>
</template>
