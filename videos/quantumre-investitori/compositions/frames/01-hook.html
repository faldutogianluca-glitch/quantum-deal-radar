  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const q = (s) => document.querySelector('[data-composition-id="01-hook"] ' + s);

      // Beat grid: Scene 1 line rises, Scene 2 orange slam at 2.6s.
      const L1 = 0.1;
      const L2 = 0.75;
      const SLAM = 2.6;

      // ── Scene 1 (0.0–2.6s): accent rule + lines rise in, one by one
      tl.fromTo(q("#h01-hook-rule"), { opacity: 0, scaleX: 0, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.05);
      tl.fromTo(q("#h01-hook-line1"), { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "circ.out" }, L1);
      tl.fromTo(q("#h01-hook-line2"), { y: 70, rotation: 3, opacity: 0, transformOrigin: "0% 100%" }, { y: 0, rotation: 0, opacity: 1, duration: 0.5, ease: "power4.out" }, L2);

      // ── Scene 2 (2.6–5.0s): "all'acquisto." slams in orange (scale + blur), underline draws, hold
      tl.fromTo(
        q("#h01-hook-line3"),
        { scale: 1.35, filter: "blur(14px)", opacity: 0, transformOrigin: "0% 60%" },
        { scale: 1, filter: "blur(0px)", opacity: 1, duration: 0.45, ease: "power4.out" },
        SLAM
      );

      // Underline (svg path draw): measured length, hidden until the slam lands.
      const uline = q("#h01-hook-uline");
      const len = uline.getTotalLength() * 1.05;
      tl.set(uline, { strokeDasharray: len, strokeDashoffset: len }, 0);
      tl.to(uline, { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, SLAM + 0.4);

      // Hold to the end (settle only).
      tl.set({}, {}, 5);

      window.__timelines["01-hook"] = tl;
    })();
