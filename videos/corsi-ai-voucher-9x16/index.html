<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #ffffff; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16" data-width="1080" data-height="1920">
      <div id="el-01-hook" class="scene" data-composition-id="01-hook" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="3" data-track-index="0"></div>
      <div id="el-02-il-conto" class="scene" data-composition-id="02-il-conto" data-composition-src="compositions/frames/02-il-conto.html" data-start="3" data-duration="4.9" data-track-index="1"></div>
      <div id="el-03-le-condizioni" class="scene" data-composition-id="03-le-condizioni" data-composition-src="compositions/frames/03-le-condizioni.html" data-start="7.5" data-duration="4" data-track-index="0"></div>
      <div id="el-04-cta" class="scene" data-composition-id="04-cta" data-composition-src="compositions/frames/04-cta.html" data-start="11.5" data-duration="4.5" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { const tl = window.__timelines["main"];
        tl.fromTo("#el-03-le-condizioni", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 7.5);
        tl.to("#el-02-il-conto", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 7.5);
        tl.to({}, { duration: 16 }, 0);
      })();
    </script>
  </body>
</html>
